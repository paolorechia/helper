[project]
name = "helper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "accelerate>=1.15.0",
    "cython>=3.3.0",
    "ddgs>=9.16.0",
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "kokoro>=0.9.4",
    "matplotlib>=3.11.2",
    "moonshine-voice>=0.1.5",
    "nemo-toolkit[asr]>=2.0.0",
    "neptune>=1.14.0.post2",
    "numpy>=2.5.4",
    "packaging>=26.3",
    "pytest-cov>=7.1.0",
    "pytorch-lightning>=2.0.0,<2.4.0",
    "requests>=2.34.2",
    "setuptools>=84.0.0",
    "sounddevice>=0.5.6",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "transformers>=5.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
# Resolve Python from the pyenv shims rather than uv's own managed downloads.
python-preference = "only-system"
python-downloads = "never"
# Use the OS trust store (patched for the eMudhra/emSign CA incident) in
# addition to uv's bundled roots.
system-certs = true
