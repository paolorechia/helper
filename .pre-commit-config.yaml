repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.1
  hooks:
    # Run the linter.
    - id: ruff-check
    # Run the formatter.
    - id: ruff-format
- repo: local
  hooks:
    # The repo's own hygiene checks, so violations are found before a push
    # rather than in CI. Standard library only: no network, no install.
    - id: file-hygiene
      name: File hygiene
      entry: python3 scripts/check_hygiene.py
      language: system
      always_run: true
      pass_filenames: false
